name: Windows Qt Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - full-prefix
          - mini-only
          - split-boundary
          - quarter-0-plus-mini
          - quarter-1-plus-mini
          - quarter-2-plus-mini
          - quarter-3-plus-mini

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run diagnostic scenario
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          DIAGNOSTIC_SCENARIO: ${{ matrix.scenario }}
        run: |
          $files = @(Get-ChildItem tests/test_*.py | Sort-Object Name | ForEach-Object { $_.FullName })
          $mini = @($files[56..62])

          Write-Host "Scenario: $env:DIAGNOSTIC_SCENARIO"
          Write-Host "Collected test files: $($files.Count)"
          Write-Host "MiniNavi boundary:"
          $mini | ForEach-Object { Write-Host "  $_" }

          switch ($env:DIAGNOSTIC_SCENARIO) {
            "full-prefix" {
              python -m pytest -vv @($files[0..62])
            }
            "mini-only" {
              python -m pytest -vv $mini
            }
            "split-boundary" {
              python -m pytest -vv @($files[0..55])
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              python -m pytest -vv $mini
            }
            "quarter-0-plus-mini" {
              python -m pytest -vv @($files[0..13] + $mini)
            }
            "quarter-1-plus-mini" {
              python -m pytest -vv @($files[14..27] + $mini)
            }
            "quarter-2-plus-mini" {
              python -m pytest -vv @($files[28..41] + $mini)
            }
            "quarter-3-plus-mini" {
              python -m pytest -vv @($files[42..55] + $mini)
            }
            default {
              throw "Unknown diagnostic scenario: $env:DIAGNOSTIC_SCENARIO"
            }
          }

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
