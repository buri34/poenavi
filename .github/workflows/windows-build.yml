name: Windows Build Verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref_name != 'feature/v410-dev'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -vv

      - name: Build release assets
        shell: pwsh
        run: .\scripts\build_release.ps1 -Python python

      - name: Verify executable metadata
        shell: pwsh
        run: |
          $expectedVersion = (python -c "from src.version import APP_VERSION; print(APP_VERSION)").Trim()
          foreach ($path in @("dist\PoENavi\PoENavi.exe", "dist\PoENavi\PoENaviUpdater.exe")) {
            $metadata = (Get-Item $path).VersionInfo
            if ($metadata.ProductName -ne "PoENavi") {
              throw "$path has unexpected ProductName: $($metadata.ProductName)"
            }
            if ($metadata.ProductVersion -ne $expectedVersion) {
              throw "$path has unexpected ProductVersion: $($metadata.ProductVersion)"
            }
            if ($metadata.FileVersion -ne $expectedVersion) {
              throw "$path has unexpected FileVersion: $($metadata.FileVersion)"
            }
          }

      - name: Upload verification artifact
        uses: actions/upload-artifact@v6
        with:
          name: PoENavi-unsigned-windows
          path: |
            PoENavi.zip
            PoENavi.zip.sha256
          if-no-files-found: error
          retention-days: 7

  diagnose-qt:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'feature/v410-dev'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - isolate-quarter-0
          - isolate-quarter-2
          - isolate-quarter-3

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run diagnostic scenario
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          DIAGNOSTIC_SCENARIO: ${{ matrix.scenario }}
        run: |
          $files = @(Get-ChildItem tests/test_*.py | Sort-Object Name | ForEach-Object { $_.FullName })
          $mini = @($files[56..62])

          Write-Host "Scenario: $env:DIAGNOSTIC_SCENARIO"
          Write-Host "Collected test files: $($files.Count)"
          Write-Host "MiniNavi boundary:"
          $mini | ForEach-Object { Write-Host "  $_" }

          switch ($env:DIAGNOSTIC_SCENARIO) {
            "isolate-quarter-0" { $candidateIndexes = 0..13 }
            "isolate-quarter-2" { $candidateIndexes = 28..41 }
            "isolate-quarter-3" { $candidateIndexes = 42..55 }
            default {
              throw "Unknown diagnostic scenario: $env:DIAGNOSTIC_SCENARIO"
            }
          }

          $failedIndexes = @()
          foreach ($index in $candidateIndexes) {
            Write-Host "::group::Candidate $index - $($files[$index])"
            python -m pytest -q @($files[$index]) $mini
            $candidateExitCode = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($candidateExitCode -ne 0) {
              $failedIndexes += $index
              Write-Host "Candidate $index failed with exit code $candidateExitCode"
            }
          }

          if ($failedIndexes.Count -gt 0) {
            throw "Failing candidate indexes: $($failedIndexes -join ', ')"
          }
