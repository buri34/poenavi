name: Release Windows App

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Verify tag matches app version
        shell: pwsh
        run: |
          $version = python -c "from src.version import APP_VERSION; print(APP_VERSION)"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match APP_VERSION $version"
          }

      # These releases are isolated to Poetore. Keep their release gate scoped
      # to the changed product, shared startup, updater, and release integrity.
      - name: Run Poetore-scoped release tests
        if: contains(fromJSON('["v4.1.0", "v4.1.6", "v4.1.7", "v4.2.0", "v4.2.1", "v4.2.3", "v4.3.0"]'), github.ref_name)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\scripts\run_poetore_release_tests.ps1 -Python python

      - name: Run Desecration-scoped release tests
        if: github.ref_name == 'v4.3.1'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q
          tests/test_build_poetore_poe2_desecration_tiers.py
          tests/test_desecration_ocr.py
          tests/test_desecration_overlay.py
          tests/test_desecration_settings_dialog.py
          tests/test_poetore_poe2_desecration_tiers.py

      - name: Run OCR-feature-scoped release tests
        if: github.ref_name == 'v4.3.2'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q
          tests/test_build_poetore_poe2_desecration_tiers.py
          tests/test_audit_poetore_poe2_desecration_update.py
          tests/test_desecration_ocr.py
          tests/test_desecration_overlay.py
          tests/test_desecration_settings_dialog.py
          tests/test_expedition_ocr_probe.py
          tests/test_expedition_settings_dialog.py
          tests/test_config_manager.py
          tests/test_feature_support.py
          tests/test_global_hotkeys.py
          tests/test_win32_suppressed_hotkey.py
          tests/test_poetore_mode_window.py
          tests/test_poetore_poe2_desecration_tiers.py
          tests/test_poetore_poe2_trade.py
          tests/test_poetore_settings_dialog.py
          tests/test_poetore_ui.py
          tests/test_poetore_distribution.py
          tests/test_windows_version_info.py

      - name: Run OCR-hotkey-recovery release tests
        if: github.ref_name == 'v4.3.3'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q
          tests/test_build_poetore_poe2_desecration_tiers.py
          tests/test_audit_poetore_poe2_desecration_update.py
          tests/test_desecration_ocr.py
          tests/test_desecration_overlay.py
          tests/test_desecration_settings_dialog.py
          tests/test_expedition_ocr_probe.py
          tests/test_expedition_settings_dialog.py
          tests/test_config_manager.py
          tests/test_feature_support.py
          tests/test_global_hotkeys.py
          tests/test_poetore_hotkey_config.py
          tests/test_win32_suppressed_hotkey.py
          tests/test_poetore_mode_window.py
          tests/test_poetore_poe2_desecration_tiers.py
          tests/test_poetore_poe2_trade.py
          tests/test_poetore_settings_dialog.py
          tests/test_poetore_ui.py
          tests/test_poetore_distribution.py
          tests/test_windows_version_info.py

      - name: Run full tests
        if: ${{ !contains(fromJSON('["v4.1.0", "v4.1.6", "v4.1.7", "v4.2.0", "v4.2.1", "v4.2.3", "v4.3.0", "v4.3.1", "v4.3.2", "v4.3.3"]'), github.ref_name) }}
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\scripts\run_tests_by_file.ps1 -Python python

      - name: Build release assets
        shell: pwsh
        run: .\scripts\build_release.ps1 -Python python

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notesFile = "docs/release-notes-$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path $notesFile)) {
            throw "Release notes file was not found: $notesFile"
          }
          gh release create $env:GITHUB_REF_NAME PoENavi.zip PoENavi.zip.sha256 --verify-tag --notes-file $notesFile --title "PoENavi $env:GITHUB_REF_NAME"
